
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              'xs': '480px', // Custom breakpoint for small mobile
            },
            fontFamily: {
              sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
            },
            colors: {
              'art-black': '#1a1a1a',
              'art-gray': '#f4f4f4',
            }
          }
        }
      }
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden; /* Prevent horizontal scroll */
      }

      /* Custom Scrollbar Design */
      ::-webkit-scrollbar {
        width: 5px; /* Thin width */
        height: 5px; /* Thin height for horizontal scroll */
      }

      ::-webkit-scrollbar-track {
        background: #ffffff; /* White track */
      }

      ::-webkit-scrollbar-thumb {
        background: #d1d1d1; /* Light gray thumb */
        border-radius: 10px; /* Fully rounded edges */
      }

      /* Firefox Support */
      html {
        scrollbar-width: thin;
        scrollbar-color: #d1d1d1 #ffffff;
      }

      /* Hide default cursor only on large screens with fine pointer */
      @media (hover: hover) and (pointer: fine) and (min-width: 1024px) {
        body {
          cursor: none;
        }
        a, button, [role="button"], input, textarea, select {
          cursor: none !important;
        }
      }
    </style>
  <script type="importmap">
{

    "@splinetool/react-spline": "https://esm.sh/@splinetool/react-spline@^4.1.0",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
    "gsap/": "https://esm.sh/gsap@^3.14.2/"
  }
}
</script>
</head>
  <body class="bg-white text-art-black selection:bg-black selection:text-white">
    <div id="root"></div>

  </body>
</html>
